# servers.conf — PostgreSQL server list for pg_list_databases.sh
#
# Format:
#   hostname[:port]  [username]
#
# - Port defaults to 5432 if not specified
# - Username defaults to "postgres" if not specified
# - Lines starting with # are comments
# - Blank lines are ignored
# - Servers will be scanned in alphabetical order
#
# Examples:
#   db1.example.com
#   db2.example.com:5432       postgres
#   db3.example.com:5433       app_user
#   192.168.1.10               readonly_user

# ── Add your servers below ────────────────────────────────────────────────────
# db1.example.com
# db2.example.com:5432   postgres
